query DiscoverPools($tokens: [String!]!) {
  pools(first: 20, orderBy: totalValueLockedUSD, orderDirection: desc, where: { token0_in: $tokens, token1_in: $tokens }) {
    id feeTier token0 { id symbol decimals } token1 { id symbol decimals } totalValueLockedUSD
  }
  _meta { deployment hasIndexingErrors block { number hash } }
}
