query MarketSnapshot($pool: ID!, $poolKey: String!, $block: Int!) {
  pool(id: $pool, block: { number: $block }) { id sqrtPrice token0 { id symbol decimals } token1 { id symbol decimals } totalValueLockedUSD volumeUSD }
  swaps(first: 1, orderBy: timestamp, orderDirection: desc, where: { pool: $poolKey }, block: { number: $block }) { id timestamp transaction { id } }
  _meta(block: { number: $block }) { deployment hasIndexingErrors block { number hash } }
}
