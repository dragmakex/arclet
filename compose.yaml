services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: intent
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: intent_wallet
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intent -d intent_wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["arclet-postgres:/var/lib/postgresql/data"]
volumes:
  arclet-postgres:
